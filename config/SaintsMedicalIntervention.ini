[General]

# Enable Saint's field-treatment system.
# 0 restores vanilla Doctor's Bag behavior; the Stats shortcut uses a bag normally.
bEnableTriage = 1


[TriageMenu]

# 0 = Show every body part
# 1 = Show crippled body parts only
bShowOnlyCrippledBodyParts = 0

# 0 = Hide condition
# 1 = Description
# 2 = Percentage
# 3 = Description and percentage
iShowBodyPartHealth = 2

# Emphasize crippled body-part conditions with asterisks.
bShowBodyPartHealthEmphasis = 1

# 0 = Hide Medicine requirements
# 1 = Show required skill
# 2 = Show current and required skill
iShowSkillRequirements = 1


[TreatmentMenu]

# 0 = Hide inventory counts
# 1 = Show counts only when requirements are unmet
# 2 = Always show counts
iShowItemRequirements = 0


[Treatment]

# Maximum fraction of limb condition restored at Medicine 100.
# Restoration continues to scale from the treatment's minimum Medicine requirement.
fMaxRestoreFactor = 0.90
